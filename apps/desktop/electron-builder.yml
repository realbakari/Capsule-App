appId: ai.capsule.desktop
productName: Capsule
directories:
  output: release
  buildResources: build
afterPack: scripts/after-pack.cjs
files:
  - out/**/*
# Native modules load a .node binary by path, which cannot be read from inside
# the asar archive.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/node-pty/**"
# Where the app looks for an update, and what electron-builder writes so it can.
# Without this there is no latest-mac.yml in a release, and with no feed the app
# can only tell someone a newer version exists and send them to download it by
# hand — which is not an update, it is a reinstall.
publish:
  - provider: github
    owner: realbakari
    repo: Capsule-App

# `capsule://` has to be declared in the bundle, or macOS never hands the app a
# link no matter what the running process registers.
protocols:
  - name: Capsule
    schemes: [capsule]

mac:
  icon: icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: Capsule-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
npmRebuild: true

# The window Finder opens for the .dmg. Icon positions here and the arrow in
# scripts/generate-dmg-background.py are drawn against the same coordinates —
# move one and move the other.
dmg:
  background: build/dmg-background.png
  window:
    width: 540
    height: 380
  iconSize: 96
  contents:
    - x: 145
      y: 195
      type: file
    - x: 395
      y: 195
      type: link
      path: /Applications
