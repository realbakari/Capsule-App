<!doctype html>
<!--
  The desktop shell starts dark and applies the saved appearance before React
  renders. The public website (cpcl.dev and its generated pages) is dark only,
  and so is the sample workspace it embeds.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://127.0.0.1:* http://localhost:*; img-src 'self' data: capsule-backdrop:; object-src 'none'; base-uri 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./icon.png" />
    <title>Capsule · A desktop workspace for coding agents</title>
    <meta name="description" content="Capsule runs Claude Code, Codex, Gemini CLI and other coding agents on your own projects. One thread per task, a checkpoint per turn, and review diffs beside the conversation. Free and open source." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Capsule" />
    <meta property="og:title" content="Capsule · A desktop workspace for coding agents" />
    <meta property="og:description" content="Run the coding agents you already use on your own projects, one thread per task, and review diffs beside the conversation." />
    <link rel="canonical" href="https://cpcl.dev/" />
    <meta property="og:url" content="https://cpcl.dev/" />
    <meta property="og:image" content="https://cpcl.dev/icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0d0d0c" />
    <!--
      The ground colour, before any stylesheet or script has run. Without it
      the document paints the browser default for the moments before the app's
      CSS arrives, which in a dev build is long enough to see.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f4f1;
        }
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0a0a0a;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f4f1;
      }
    </style>
  </head>
  <body>
    <noscript>Capsule is a desktop workspace for coding agents. <a href="https://github.com/realbakari/Capsule-App/releases/latest">Download Capsule</a> or <a href="https://github.com/realbakari/Capsule-App/blob/main/docs/user/getting-started.md">read the setup guide</a>. Enable JavaScript to view the sample workspace.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
