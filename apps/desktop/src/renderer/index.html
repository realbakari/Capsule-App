<!doctype html>
<!--
  Dark from the first byte.

  The module script is deferred, so on a light Mac the document painted
  #f4f4f1 and went dark once it ran — a flash on the website, which is dark
  and only dark. The desktop app overwrites this attribute with the theme you
  chose before React renders, so it costs nothing there.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://127.0.0.1:* http://localhost:*; img-src 'self' data:; object-src 'none'; base-uri 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./icon.png" />
    <title>Capsule | Your coding agents. One workspace.</title>
    <meta name="description" content="A desktop workspace for your coding agents. Follow tasks, review diffs, and work across projects with your existing tools and account." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Capsule" />
    <meta property="og:title" content="Capsule | Your coding agents. One workspace." />
    <meta property="og:description" content="Follow tasks, review diffs, and work across projects with the coding agents you already use." />
    <meta property="og:image" content="https://capsule-app-desktop.vercel.app/icon.png" />
    <meta name="twitter:card" content="summary" />
    <!--
      The ground colour, before any stylesheet or script has run. Without it
      the document paints the browser default for the moments before the app's
      CSS arrives, which in a dev build is long enough to see.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f4f1;
        }
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0a0a0a;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f4f1;
      }
    </style>
  </head>
  <body>
    <noscript>Capsule is a desktop workspace for coding agents. <a href="https://github.com/realbakari/Capsule-App/releases/latest">Download Capsule</a> or <a href="https://github.com/realbakari/Capsule-App/blob/main/docs/user/getting-started.md">read the setup guide</a>. Enable JavaScript to view the sample workspace.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
